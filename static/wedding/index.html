<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f7efe6">
    <title>黄竟通 ♥ 姜雪澳 · 婚礼邀请函</title>
    <meta name="description" content="2026年10月11日 · 江苏省徐州市泉山区 · 百合茗宴(全季店)">

    <!-- 微信分享专用标签 -->
    <meta name="wx.share.title" content="黄竟通 ♥ 姜雪澳 · 婚礼邀请函">
    <meta name="wx.share.desc" content="2026年10月11日(周六)上午11:00 · 徐州百合茗宴(全季店) · 诚邀您共赴这场关于爱与承诺的邀约">
    <meta name="wx.share.img" content="https://arc-huangjingtong.com/wedding/share-thumb.jpg">

    <!-- Open Graph 标签(其他平台兜底) -->
    <meta property="og:title" content="黄竟通 ♥ 姜雪澳 · 婚礼邀请函">
    <meta property="og:description" content="2026年10月11日(周六)上午11:00 · 徐州百合茗宴(全季店) · 诚邀您共赴这场关于爱与承诺的邀约">
    <meta property="og:image" content="https://arc-huangjingtong.com/wedding/share-thumb.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arc-huangjingtong.com/wedding/">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
    <style>
        :root {
            --bg-1: #faf3ec;
            --bg-2: #f3e7da;
            --ink-1: #5b4636;
            --ink-2: #8b7460;
            --accent: #c98a8a;
            --accent-deep: #a85f5f;
            --card: #fffaf4;
            --line: #e8d9c4;
            --gold: #b8945f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background:
                radial-gradient(1200px 600px at 50% -100px, #fff5ec 0%, transparent 60%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            color: var(--ink-1);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 64px;
        }

        /* ——— 顶部装饰 ——— */
        .ornament {
            width: 100%;
            max-width: 520px;
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .ornament-rule {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .ornament-rule::before,
        .ornament-rule::after {
            content: "";
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.6;
        }

        h1.names {
            font-family: "Songti SC", "STSong", "STKaiti", "KaiTi", "楷体", serif;
            font-size: clamp(28px, 7vw, 40px);
            font-weight: 600;
            letter-spacing: 0.12em;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        h1.names .heart {
            display: inline-block;
            color: var(--accent);
            font-size: 0.8em;
            margin: 0 0.3em;
            transform: translateY(-2px);
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        .subtitle {
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            color: var(--ink-2);
            font-size: 14px;
            letter-spacing: 0.3em;
            margin-bottom: 6px;
        }

        .date-line {
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            color: var(--ink-1);
            font-size: 16px;
            letter-spacing: 0.18em;
            margin-top: 14px;
        }
        .date-line .day {
            display: inline-block;
            color: var(--accent-deep);
            font-weight: 600;
            margin: 0 4px;
        }

        /* ——— 邀请函图片卡 ——— */
        .invitation-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 26px auto 32px;
            padding: 14px;
            background: var(--card);
            border-radius: 18px;
            box-shadow:
                0 2px 8px rgba(91, 70, 54, 0.08),
                0 18px 40px -12px rgba(91, 70, 54, 0.18);
        }
        .invitation-card::before,
        .invitation-card::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid var(--line);
            border-radius: 12px;
            pointer-events: none;
        }
        .invitation-card::after { inset: 10px; border-style: dashed; opacity: 0.6; }
        .invitation-card img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* ——— 详情卡 ——— */
        .details {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 16px;
            padding: 22px 22px 26px;
            box-shadow: 0 12px 30px -16px rgba(91, 70, 54, 0.25);
        }

        .detail-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px dashed var(--line);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label {
            flex: 0 0 auto;
            min-width: 56px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            color: var(--accent-deep);
            font-size: 15px;
            letter-spacing: 0.2em;
        }
        .detail-row .value {
            flex: 1;
            color: var(--ink-1);
            font-size: 15px;
            line-height: 1.7;
        }
        .detail-row .value small {
            display: block;
            color: var(--ink-2);
            font-size: 13px;
            margin-top: 2px;
        }

        /* ——— 按钮 ——— */
        .actions {
            width: 100%;
            max-width: 420px;
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            appearance: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: #fff;
            box-shadow: 0 10px 24px -10px rgba(168, 95, 95, 0.6);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(168, 95, 95, 0.7); }
        .btn-primary:active { transform: translateY(0); box-shadow: 0 6px 14px -6px rgba(168, 95, 95, 0.5); }
        .btn-primary .icon {
            width: 20px; height: 20px;
            display: inline-flex;
            align-items: center; justify-content: center;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--ink-1);
            border: 1px solid var(--line);
        }
        .btn-secondary:hover { background: #fff5ec; }
        .btn-secondary:active { background: var(--bg-2); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(60, 45, 30, 0.92);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ——— 页脚 ——— */
        footer {
            width: 100%;
            max-width: 420px;
            margin-top: 36px;
            text-align: center;
            color: var(--ink-2);
            font-size: 12px;
            letter-spacing: 0.2em;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }
        footer .hearts { color: var(--accent); letter-spacing: 0.3em; margin-top: 4px; }

        @keyframes heartbeat {
            0%, 100% { transform: translateY(-2px) scale(1); }
            50% { transform: translateY(-2px) scale(1.18); }
        }

        /* ——— 桌面端微调 ——— */
        @media (min-width: 720px) {
            body { padding: 48px 24px 80px; }
        }
    </style>
</head>
<body>

    <header class="ornament">
        <div class="ornament-rule">Wedding Invitation</div>
        <h1 class="names">
            黄竟通<span class="heart">♥</span>姜雪澳
        </h1>
        <div class="subtitle">诚 邀 莅 临</div>
        <div class="date-line">
            <span class="day">2026</span>年<span class="day">10</span>月<span class="day">11</span>日 · 周六 · 上午 11:00
        </div>
    </header>

    <figure class="invitation-card">
        <picture>
            <source srcset="./invitation.webp" type="image/webp">
            <img src="./invitation.jpg" alt="黄竟通 & 姜雪澳 婚礼邀请函"
                 width="1206" height="8433"
                 loading="eager" fetchpriority="high" decoding="async">
        </picture>
    </figure>

    <section class="details" aria-label="婚礼信息">
        <div class="detail-row">
            <div class="label">日期</div>
            <div class="value">
                2026 年 10 月 11 日(周六)
                <small>农历九月廿二 · 上午 11:00</small>
            </div>
        </div>
        <div class="detail-row">
            <div class="label">地点</div>
            <div class="value" id="venue-address">
                百合茗宴(全季店)
                <small>江苏省徐州市泉山区北京北路与欣欣路交汇处大润发北侧</small>
            </div>
        </div>
        <div class="detail-row">
            <div class="label">席位</div>
            <div class="value">
                敬备薄酌 恭候光临
                <small>携手共赴这一场关于爱与承诺的邀约</small>
            </div>
        </div>
    </section>

    <div class="actions">
        <a id="amap-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener">
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                </svg>
            </span>
            打开高德地图导航
        </a>
        <button id="copy-btn" class="btn btn-secondary" type="button">
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </span>
            复制详细地址
        </button>
    </div>

    <footer>
        <div>愿 你 的 赴 约 是 最 美 的 答 案</div>
        <div class="hearts">♥ ♥ ♥</div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        // 高德地图唤起逻辑
        // 1) 优先用 marker(已知大致经纬度,定位更准);这里使用 venue 名作为搜索关键词,稳定性更好
        // 2) URL Scheme 在移动端可唤起高德 App,PC 端打开网页版
        // 3) 添加 src 参数用于来源追踪
        (function () {
            const venueName = '百合茗宴(全季店)';
            const city = '徐州';
            const amapUrl = 'https://uri.amap.com/search?keyword='
                + encodeURIComponent(venueName)
                + '&city=' + encodeURIComponent(city)
                + '&src=wedding-invitation';
            const btn = document.getElementById('amap-btn');
            if (btn) btn.href = amapUrl;

            // 复制地址
            const copyBtn = document.getElementById('copy-btn');
            const address = '百合茗宴(全季店),江苏省徐州市泉山区北京北路与欣欣路交汇处大润发北侧';
            const toast = document.getElementById('toast');

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            copyBtn.addEventListener('click', async function () {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(address);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = address;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    showToast('地址已复制 ✓');
                } catch (e) {
                    showToast('复制失败,请长按选择');
                }
            });
        })();
    </script>

</body>
</html>
