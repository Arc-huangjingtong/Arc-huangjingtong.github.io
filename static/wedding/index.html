<html lang="zh-CN">
<head>

    <!-- Open Graph 标签(其他平台兜底) -->
    <meta property="og:title" content="黄竟通 ♥ 姜雪澳 · 婚礼邀请函">
    <meta property="og:description" content="2026年10月11日(周日)上午11:58 · 徐州百合茗宴(全季店) · 诚邀您共赴这场关于爱与承诺的邀约">
    <meta property="og:image" content="https://arc-huangjingtong.com/wedding/share-thumb.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arc-huangjingtong.com/wedding/">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
    <style>
        :root {
            --bg-1: #faf3ec;
            --bg-2: #f3e7da;
            --ink-1: #5b4636;
            --ink-2: #8b7460;
            --accent: #c98a8a;
            --accent-deep: #a85f5f;
            --card: #fffaf4;
            --line: #e8d9c4;
            --gold: #b8945f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background:
                radial-gradient(1200px 600px at 50% -100px, #fff5ec 0%, transparent 60%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            color: var(--ink-1);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 64px;
        }

        /* ——— 顶部装饰 ——— */
        .ornament {
            width: 100%;
            max-width: 520px;
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .ornament-rule {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .ornament-rule::before,
        .ornament-rule::after {
            content: "";
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.6;
        }

        h1.names {
            font-family: "Songti SC", "STSong", "STKaiti", "KaiTi", "楷体", serif;
            font-size: clamp(28px, 7vw, 40px);
            font-weight: 600;
            letter-spacing: 0.12em;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        h1.names .heart {
            display: inline-block;
            color: var(--accent);
            font-size: 0.8em;
            margin: 0 0.3em;
            transform: translateY(-2px);
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        .subtitle {
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            color: var(--ink-2);
            font-size: 14px;
            letter-spacing: 0.3em;
            margin-bottom: 6px;
        }

        .date-line {
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            color: var(--ink-1);
            font-size: 16px;
            letter-spacing: 0.18em;
            margin-top: 14px;
        }
        .date-line .day {
            display: inline-block;
            color: var(--accent-deep);
            font-weight: 600;
            margin: 0 4px;
        }

        /* ——— 邀请函图片卡 ——— */
        .invitation-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 26px auto 32px;
            padding: 14px;
            background: var(--card);
            border-radius: 18px;
            box-shadow:
                0 2px 8px rgba(91, 70, 54, 0.08),
                0 18px 40px -12px rgba(91, 70, 54, 0.18);
        }
        .invitation-card::before,
        .invitation-card::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid var(--line);
            border-radius: 12px;
            pointer-events: none;
        }
        .invitation-card::after { inset: 10px; border-style: dashed; opacity: 0.6; }
        .invitation-card img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* ——— 详情卡 ——— */
        .details {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 16px;
            padding: 22px 22px 26px;
            box-shadow: 0 12px 30px -16px rgba(91, 70, 54, 0.25);
        }

        .detail-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px dashed var(--line);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label {
            flex: 0 0 auto;
            min-width: 56px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            color: var(--accent-deep);
            font-size: 15px;
            letter-spacing: 0.2em;
        }
        .detail-row .value {
            flex: 1;
            color: var(--ink-1);
            font-size: 15px;
            line-height: 1.7;
        }
        .detail-row .value small {
            display: block;
            color: var(--ink-2);
            font-size: 13px;
            margin-top: 2px;
        }

        /* ——— 按钮 ——— */
        .actions {
            width: 100%;
            max-width: 420px;
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            appearance: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: #fff;
            box-shadow: 0 10px 24px -10px rgba(168, 95, 95, 0.6);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(168, 95, 95, 0.7); }
        .btn-primary:active { transform: translateY(0); box-shadow: 0 6px 14px -6px rgba(168, 95, 95, 0.5); }
        .btn-primary .icon {
            width: 20px; height: 20px;
            display: inline-flex;
            align-items: center; justify-content: center;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--ink-1);
            border: 1px solid var(--line);
        }
        .btn-secondary:hover { background: #fff5ec; }
        .btn-secondary:active { background: var(--bg-2); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(60, 45, 30, 0.92);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ——— 页脚 ——— */
        footer {
            width: 100%;
            max-width: 420px;
            margin-top: 36px;
            text-align: center;
            color: var(--ink-2);
            font-size: 12px;
            letter-spacing: 0.2em;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }
        footer .hearts { color: var(--accent); letter-spacing: 0.3em; margin-top: 4px; }

        @keyframes heartbeat {
            0%, 100% { transform: translateY(-2px) scale(1); }
            50% { transform: translateY(-2px) scale(1.18); }
        }

        /* ——— 入场动画 ——— */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes ruleExpand {
            from { transform: scaleX(0); opacity: 0; }
            to   { transform: scaleX(1); opacity: 0.6; }
        }
        @keyframes softGlow {
            0%, 100% { text-shadow: 0 0 4px rgba(201, 138, 138, 0.0); }
            50%      { text-shadow: 0 0 14px rgba(201, 138, 138, 0.55); }
        }
        @keyframes btnShine {
            0%   { transform: translateX(-120%) skewX(-20deg); }
            60%, 100% { transform: translateX(220%) skewX(-20deg); }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .ornament        { animation: fadeInUp 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s both; }
        .ornament-rule   { animation: fadeIn 0.9s ease 0.25s both; }
        .ornament-rule::before,
        .ornament-rule::after { animation: ruleExpand 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.55s both; transform-origin: center; }
        h1.names         { animation: fadeInUp 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.4s both; }
        .subtitle        { animation: fadeInUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.55s both; }
        .date-line       { animation: fadeInUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.7s both; }

        /* ——— 滚动渐入（配合 JS IntersectionObserver） ——— */
        .reveal {
            opacity: 0;
            transform: translateY(26px);
            transition: opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1), transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
            will-change: opacity, transform;
        }
        .reveal.in-view { opacity: 1; transform: translateY(0); }

        /* ——— 页脚爱心柔光 + 悬浮 ——— */
        footer .hearts span {
            display: inline-block;
            animation: softGlow 2.4s ease-in-out infinite, floatY 3s ease-in-out infinite;
        }
        footer .hearts span:nth-child(2) { animation-delay: 0.4s, 0.6s; }
        footer .hearts span:nth-child(3) { animation-delay: 0.8s, 1.2s; }

        /* ——— 按钮柔光扫过 ——— */
        .btn-primary { position: relative; overflow: hidden; }
        .btn-primary::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: translateX(-120%) skewX(-20deg);
            pointer-events: none;
        }
        .btn-primary:hover::after { animation: btnShine 0.9s ease; }

        /* ——— 地图导航选择面板 ——— */
        .nav-mask {
            position: fixed;
            inset: 0;
            background: rgba(60, 45, 30, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1100;
        }
        .nav-mask.show { opacity: 1; pointer-events: auto; }

        .nav-sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%) translateY(105%);
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 20px 20px 0 0;
            padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
            box-shadow: 0 -8px 32px rgba(60, 45, 30, 0.18);
            transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 1101;
        }
        .nav-sheet.show { transform: translateX(-50%) translateY(0); }

        .nav-sheet-title {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--ink-1);
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .nav-opt {
            appearance: none;
            border: none;
            background: var(--bg-2);
            border-radius: 14px;
            padding: 14px 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .nav-opt:hover { background: #efe2d2; transform: translateY(-1px); }
        .nav-opt:active { transform: translateY(0) scale(0.97); }
        .nav-opt .badge {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .nav-opt .name { font-size: 12px; color: var(--ink-2); font-weight: 500; }

        .nav-cancel {
            appearance: none;
            border: none;
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border-radius: 999px;
            background: var(--bg-2);
            color: var(--ink-2);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.1em;
        }
        .nav-cancel:hover { background: var(--bg-3); }

        /* ——— 桌面端微调 ——— */
        @media (min-width: 720px) {
            body { padding: 48px 24px 80px; }
        }

        /* ===== 背景音乐按钮 ===== */
        .music-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,250,244,0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(201,138,138,0.3);
            box-shadow: 0 4px 14px rgba(91,70,54,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 0;
        }
        .music-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(91,70,54,0.22);
        }
        .music-btn:active { transform: scale(0.95); }
        .music-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--accent-deep);
            transition: opacity 0.2s;
        }
        .music-btn .icon-pause { display: none; }
        .music-btn.playing .icon-play { display: none; }
        .music-btn.playing .icon-pause { display: block; }
        .music-btn.playing {
            animation: musicSpin 4s linear infinite;
        }
        .music-btn .pulse {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid rgba(201,138,138,0.4);
            opacity: 0;
            animation: musicPulse 2s ease-out infinite;
        }
        .music-btn.playing .pulse { opacity: 1; }
        @keyframes musicSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes musicPulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .music-tip {
            position: fixed;
            bottom: 92px;
            right: 24px;
            background: rgba(91,70,54,0.85);
            color: #fff;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            z-index: 998;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            letter-spacing: 0.05em;
        }
        .music-tip.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- 背景音乐 -->
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
    <button id="music-btn" class="music-btn" type="button" aria-label="背景音乐">
        <span class="pulse"></span>
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div id="music-tip" class="music-tip">点击播放音乐</div>

    <header class="ornament">
        <div class="ornament-rule">Wedding Invitation</div>
        <h1 class="names">
            黄竟通<span class="heart">♥</span>姜雪澳
        </h1>
        <div class="subtitle">诚 邀 莅 临</div>
        <div class="date-line">
            <span class="day">2026</span>年<span class="day">10</span>月<span class="day">11</span>日 · 周日 · 上午 11:58
        </div>
    </header>

    <figure class="invitation-card reveal">
        <picture>
            <source srcset="./invitation.webp" type="image/webp">
            <img src="./invitation.jpg" alt="黄竟通 & 姜雪澳 婚礼邀请函"
                 width="1206" height="8433"
                 loading="eager" fetchpriority="high" decoding="async">
        </picture>
    </figure>

    <section class="details reveal" aria-label="婚礼信息">
        <div class="detail-row">
            <div class="label">日期</div>
            <div class="value">
                2026 年 10 月 11 日(周日)
                <small>农历九月初二 · 上午 11:58</small>
            </div>
        </div>
        <div class="detail-row">
            <div class="label">地点</div>
            <div class="value" id="venue-address">
                百合茗宴(全季店)
                <small>江苏省徐州市泉山区北京北路与欣欣路交汇处大润发北侧</small>
            </div>
        </div>
        <div class="detail-row">
            <div class="label">席位</div>
            <div class="value">
                敬备薄酌 恭候光临
                <small>携手共赴这一场关于爱与承诺的邀约</small>
            </div>
        </div>
    </section>

    <div class="actions reveal">
        <button id="nav-btn" class="btn btn-primary" type="button">
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                </svg>
            </span>
            打开地图导航
        </button>
        <button id="copy-btn" class="btn btn-secondary" type="button">
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </span>
            复制详细地址
        </button>
    </div>

    <!-- 地图导航选择面板 -->
    <div class="nav-mask" id="nav-mask"></div>
    <div class="nav-sheet" id="nav-sheet" role="dialog" aria-modal="true" aria-label="选择导航软件">
        <div class="nav-sheet-title">选择导航软件</div>
        <div class="nav-grid">
            <button class="nav-opt" type="button" data-map="amap">
                <span class="badge" style="background:#2e9fff;">高</span>
                <span class="name">高德地图</span>
            </button>
            <button class="nav-opt" type="button" data-map="baidu">
                <span class="badge" style="background:#3385ff;">百</span>
                <span class="name">百度地图</span>
            </button>
            <button class="nav-opt" type="button" data-map="tencent">
                <span class="badge" style="background:#0abf53;">腾</span>
                <span class="name">腾讯地图</span>
            </button>
            <button class="nav-opt" type="button" data-map="apple">
                <span class="badge" style="background:#5b4636;">苹</span>
                <span class="name">Apple 地图</span>
            </button>
        </div>
        <button class="nav-cancel" id="nav-cancel" type="button">取消</button>
    </div>

    <footer>
        <div>愿 你 的 赴 约 是 最 美 的 答 案</div>
        <div class="hearts"><span>♥</span> <span>♥</span> <span>♥</span></div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        // 地图导航唤起逻辑
        // 点击「打开地图导航」弹出选择面板,由用户自选高德/百度/腾讯/Apple 地图
        // 均使用无需 API key 的网页版 URI,移动端打开会引导唤起对应 App,PC 端打开网页版
        (function () {
            const venueName = '百合茗宴(全季店)';
            const city = '徐州';
            const address = '百合茗宴(全季店),江苏省徐州市泉山区北京北路与欣欣路交汇处大润发北侧';

            // 各导航软件链接(关键词搜索,定位稳定)
            const mapUrls = {
                amap: 'https://uri.amap.com/search?keyword='
                    + encodeURIComponent(venueName)
                    + '&city=' + encodeURIComponent(city)
                    + '&src=wedding-invitation',
                baidu: 'https://map.baidu.com/search/'
                    + encodeURIComponent(venueName)
                    + '@' + encodeURIComponent(city),
                tencent: 'https://apis.map.qq.com/uri/v1/search?keyword='
                    + encodeURIComponent(venueName)
                    + '&region=' + encodeURIComponent(city)
                    + '&referer=wedding-invitation',
                apple: 'https://maps.apple.com/?q='
                    + encodeURIComponent(venueName + ',' + city)
            };

            // 打开/关闭选择面板
            const mask = document.getElementById('nav-mask');
            const sheet = document.getElementById('nav-sheet');
            const navBtn = document.getElementById('nav-btn');
            const cancelBtn = document.getElementById('nav-cancel');

            function openSheet() {
                mask.classList.add('show');
                sheet.classList.add('show');
            }
            function closeSheet() {
                mask.classList.remove('show');
                sheet.classList.remove('show');
            }

            navBtn.addEventListener('click', openSheet);
            cancelBtn.addEventListener('click', closeSheet);
            mask.addEventListener('click', closeSheet);
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeSheet();
            });

            // 选择某款导航 → 打开对应链接
            document.querySelectorAll('.nav-opt').forEach(function (opt) {
                opt.addEventListener('click', function () {
                    const key = this.dataset.map;
                    const url = mapUrls[key];
                    if (url) window.open(url, '_blank', 'noopener');
                    closeSheet();
                });
            });

            // 复制地址
            const copyBtn = document.getElementById('copy-btn');
            const toast = document.getElementById('toast');

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            copyBtn.addEventListener('click', async function () {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(address);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = address;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    showToast('地址已复制 ✓');
                } catch (e) {
                    showToast('复制失败,请长按选择');
                }
            });
        })();

        // 滚动渐入动效
        (function () {
            var revealEls = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window) || revealEls.length === 0) {
                revealEls.forEach(function (el) { el.classList.add('in-view'); });
                return;
            }
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
            revealEls.forEach(function (el) { io.observe(el); });
        })();

        // ===== 背景音乐自动播放 =====
        (function () {
            var audio = document.getElementById('bgm');
            var btn = document.getElementById('music-btn');
            var tip = document.getElementById('music-tip');
            var hasInteracted = false;

            function tryPlay() {
                var p = audio.play();
                if (p && typeof p.then === 'function') {
                    p.then(function () {
                        btn.classList.add('playing');
                        tip.classList.remove('show');
                    }).catch(function () { showTip(); });
                }
            }
            function showTip() {
                tip.classList.add('show');
                setTimeout(function () { tip.classList.remove('show'); }, 3000);
            }
            function togglePlay() {
                if (audio.paused) {
                    audio.play().then(function () {
                        btn.classList.add('playing');
                        tip.classList.remove('show');
                    }).catch(function () { showTip(); });
                } else {
                    audio.pause();
                    btn.classList.remove('playing');
                }
            }
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                togglePlay();
            });
            window.addEventListener('load', function () {
                setTimeout(tryPlay, 300);
            });
            function onFirstInteract() {
                if (hasInteracted) return;
                hasInteracted = true;
                if (audio.paused) {
                    audio.play().then(function () {
                        btn.classList.add('playing');
                        tip.classList.remove('show');
                    }).catch(function () {});
                }
                document.removeEventListener('click', onFirstInteract);
                document.removeEventListener('touchstart', onFirstInteract);
                document.removeEventListener('keydown', onFirstInteract);
            }
            document.addEventListener('click', onFirstInteract);
            document.addEventListener('touchstart', onFirstInteract);
            document.addEventListener('keydown', onFirstInteract);
        })();
    </script>

</body>
</html>
